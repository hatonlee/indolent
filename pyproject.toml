[project]
name = "indolent"
requires-python = "^3.13"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

dependencies = [
    "sqlalchemy (>=2.0.44,<3.0.0)",
    "invoke (>=2.2.1,<3.0.0)"
]

[dependency-groups]
dev = [
    "pytest (>=9.0.1,<10.0.0)",
    "coverage (>=7.12.0,<8.0.0)",
    "black (>=25.11.0,<26.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "pylint (>=4.0.3,<5.0.0)",
    "pre-commit (>=4.5.0,<5.0.0)"
]

[tool.poetry]
package-mode = false

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.pylint.main]
fail-under = "9.0"

[tool.pylint.format]
max-line-length = "88"